# Daily deploy (default 23:55 UTC). Runs backend e2e + frontend production build;
# if both pass, rsyncs to the server and runs docker-update.sh.
# Secrets: DEPLOY_SSH_KEY, DEPLOY_HOST. Optional: adjust deploy path in rsync/ssh steps (default /usr/src/pricefly).
name: Daily Deploy

on:
  schedule:
    - cron: '55 23 * * *'
  workflow_dispatch:

env:
  DEPLOY_PATH: /usr/src/pricefly

jobs:
  backend-e2e:
    name: Backend E2E (Jest)
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires DATABASE_URL even for `prisma generate` (no DB connection needed)
      DATABASE_URL: postgresql://pricetracker:pricetracker@localhost:5432/pricetracker?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pricetracker
          POSTGRES_PASSWORD: pricetracker
          POSTGRES_DB: pricetracker
        options: >-
          --health-cmd "pg_isready -U pricetracker -d pricetracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Run database migrations
        working-directory: backend
        run: npm run prisma:migrate

      - name: Run backend E2E
        working-directory: backend
        run: npm run test:e2e

  frontend-build:
    name: Frontend (production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npm run build -- --configuration production

  deploy:
    name: Deploy to server
    needs: [backend-e2e, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync repo to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude 'backend/node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/dist' \
            --exclude 'frontend/dist' \
            --exclude 'frontend/.angular' \
            --exclude 'coverage' \
            --exclude '.git' \
            --exclude 'nginx/certbot_conf' \
            ./ root@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Run docker-update on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && (command -v dos2unix >/dev/null && dos2unix docker-update.sh || true) && chmod +x docker-update.sh && ./docker-update.sh"
