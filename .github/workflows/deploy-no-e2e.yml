# Manual only: deploy without running CI tests (hotfix path).
# Secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, SSL_PRIMARY_DOMAIN, LETSENCRYPT_EMAIL (certbot). Optional: SSL_EXTRA_DOMAINS.
name: Deploy (no E2E)

on:
  workflow_dispatch:

env:
  DEPLOY_PATH: /usr/src/pricefly

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # Fresh server: deploy path + TLS dirs (gitignored / rsync-excluded; bind mounts need them to exist)
      - name: Prepare server directories
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p '${{ env.DEPLOY_PATH }}/nginx/certbot_conf' '${{ env.DEPLOY_PATH }}/nginx/certbot_www' && chmod -R u+rwX '${{ env.DEPLOY_PATH }}/nginx/certbot_conf' '${{ env.DEPLOY_PATH }}/nginx/certbot_www'"

      - name: Rsync repo to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude 'backend/node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/dist' \
            --exclude 'frontend/dist' \
            --exclude 'frontend/.angular' \
            --exclude 'coverage' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'nginx/certbot_conf' \
            ./ root@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

      # Only TLS keys are merged — not mail/PayPal/DB. APP_PUBLIC_URL stays in your manual server .env if you set it.
      - name: Merge TLS settings into server .env
        env:
          SSL_PRIMARY_DOMAIN: ${{ secrets.SSL_PRIMARY_DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          SSL_EXTRA_DOMAINS: ${{ secrets.SSL_EXTRA_DOMAINS }}
        run: |
          if [ -z "$SSL_PRIMARY_DOMAIN" ] || [ -z "$LETSENCRYPT_EMAIL" ]; then
            echo "::error::Add repository secrets SSL_PRIMARY_DOMAIN and LETSENCRYPT_EMAIL (required for certbot-init)."
            exit 1
          fi
          printf '%s\n' \
            "SSL_PRIMARY_DOMAIN=$SSL_PRIMARY_DOMAIN" \
            "LETSENCRYPT_EMAIL=$LETSENCRYPT_EMAIL" \
            > /tmp/ssl_fragment.env
          if [ -n "$SSL_EXTRA_DOMAINS" ]; then
            printf '%s\n' "SSL_EXTRA_DOMAINS=$SSL_EXTRA_DOMAINS" >> /tmp/ssl_fragment.env
          fi
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/ssl_fragment.env root@${{ secrets.DEPLOY_HOST }}:/tmp/ssl_fragment.env
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            "cd '${{ env.DEPLOY_PATH }}' && touch .env && (grep -vE '^(SSL_PRIMARY_DOMAIN|LETSENCRYPT_EMAIL|SSL_EXTRA_DOMAINS)=' .env > .env.tmp || true) && mv .env.tmp .env && cat /tmp/ssl_fragment.env >> .env && rm -f /tmp/ssl_fragment.env"

      - name: Run docker-update on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            "bash -lc 'cd ${{ env.DEPLOY_PATH }} && (command -v dos2unix >/dev/null && dos2unix docker-update.sh || true) && chmod +x docker-update.sh && ./docker-update.sh'"
