# Manual: logs for the API container (Compose service: api).
name: Get API container logs

on:
  workflow_dispatch:
    inputs:
      tail:
        description: 'Number of lines to show (default 500)'
        required: false
        default: '500'

env:
  DEPLOY_PATH: /usr/src/pricefly

jobs:
  get-logs:
    name: API container logs
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Get api logs
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && docker compose -f docker-compose.yml -f docker-compose.ssl.yml logs --tail=${{ inputs.tail }} api"
