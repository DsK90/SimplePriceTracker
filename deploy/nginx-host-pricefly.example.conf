# Example host nginx (Debian/Ubuntu: /etc/nginx/sites-available/).
# Adjust SSL paths and upstream ports. Certbot can add or extend `listen 443 ssl` blocks.
#
# Upstreams: Docker Compose maps `web` → 8080, `api` → 3000 (see repo docker-compose.yml).
# If you use only the `web` container (nginx proxies /api), expose only 8080.

upstream pricefly_web {
    server 127.0.0.1:8080;
}

upstream umami_app {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name pricefly.reikalabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pricefly.reikalabs.com;

    ssl_certificate     /etc/letsencrypt/live/pricefly.reikalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pricefly.reikalabs.com/privkey.pem;

    location / {
        proxy_pass http://pricefly_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name umami.reikalabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name umami.reikalabs.com;

    ssl_certificate     /etc/letsencrypt/live/umami.reikalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umami.reikalabs.com/privkey.pem;

    location / {
        proxy_pass http://umami_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
