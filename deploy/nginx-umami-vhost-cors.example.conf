# Example: HTTPS vhost for Umami with CORS on /api/send so sites on OTHER domains
# (e.g. Pricefly on pricefly.reikalabs.com) can send pageviews to umami.showbk.com.
#
# 1. Adjust server_name, ssl_certificate paths, and upstream (port).
# 2. Merge the two `location` blocks into your existing Umami server { } if you already have one.
# 3. nginx -t && reload nginx

upstream umami_app {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name umami.showbk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name umami.showbk.com;

    ssl_certificate     /etc/letsencrypt/live/umami.showbk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umami.showbk.com/privkey.pem;

    # Collect API: CORS for cross-origin fetch() from embedded script.js
    location = /api/send {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, x-umami-cache" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://umami_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # So browsers on other origins can read a minimal response / avoid CORS errors
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    }

    location / {
        proxy_pass http://umami_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
