# Example: run Umami on the same Hetzner host (separate stack from SimplePriceTracker).
# Copy to e.g. /opt/umami/docker-compose.yml, set secrets, then:
#   docker compose up -d
# Point nginx (or Cloudflare) at umami.reikalabs.com → port 3001 (or change the mapping).

services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      # Optional: preflight cache (see https://docs.umami.is/docs/environment-variables)
      # CORS_MAX_AGE: "86400"
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:
