networks:
  pricefly_net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricetracker}
      POSTGRES_DB: ${POSTGRES_DB:-pricetracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5460:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pricefly_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pricetracker:pricetracker@postgres:5432/pricetracker?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_SEC: ${JWT_EXPIRES_SEC:-604800}
      PAYPAL_USE_SANDBOX: ${PAYPAL_USE_SANDBOX:-true}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_SANDBOX_CLIENT_ID: ${PAYPAL_SANDBOX_CLIENT_ID:-}
      PAYPAL_SANDBOX_SECRET: ${PAYPAL_SANDBOX_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # Must match the live Angular URL for e-mail verification links (no trailing slash). If unset, first public origin from CORS_ORIGIN is used.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-false}
      SEND_PRICE_ALERT_EMAILS: ${SEND_PRICE_ALERT_EMAILS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      PAYPAL_PRO_PLAN_ID: ${PAYPAL_PRO_PLAN_ID:-P-6TL7122718514241MNHCG5QQ}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200,http://localhost:8080,http://localhost,http://127.0.0.1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@example.com}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pricefly_net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
        PAYPAL_SANDBOX_CLIENT_ID: ${PAYPAL_SANDBOX_CLIENT_ID:-}
        PAYPAL_USE_SANDBOX: ${PAYPAL_USE_SANDBOX:-true}
        UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    expose:
      - '80'
    ports:
      - '8080:80'
    depends_on:
      - api
    networks:
      - pricefly_net

volumes:
  pgdata:
