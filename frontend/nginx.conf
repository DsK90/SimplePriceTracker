# Nginx inside the `web` Docker image only: static Angular + /api → backend.
# pgAdmin is NOT here. With docker-compose.ssl.yml, TLS edge (`pricefly_edge`) proxies
# https://<domain>/<PGADMIN_WEB_PATH>/ to the `pgadmin` service — see repo `nginx/edge.conf.template`.
#
# When the origin sits behind Cloudflare (or another proxy), preserve the client-facing scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
